name: CD – Deploy no Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy do frontend no Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front end/vite-project

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "Front end/vite-project/package-lock.json"

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # NAO passar VITE_API_BASE_URL aqui: um secret vazio (unset) sobrescreve
          # o valor de .env.production com "" (testado). A URL publica do backend e
          # a fonte unica de verdade em Front end/vite-project/.env.production.

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy no Vercel (produção)
        # Roda a partir da RAIZ do repo (nao de Front end/vite-project): o
        # projeto no Vercel ja tem Root Directory=Front end/vite-project, entao
        # deployar de dentro dessa pasta dobrava o caminho e falhava.
        working-directory: ${{ github.workspace }}
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
